name: CI
"on":  
  pull_request:
    branches:
      - main
  
  workflow_dispatch:

permissions:
  contents: read
 

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_TAG: ci-${{ github.sha }}


jobs:
  build:
    name: Build and validate Docker image
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Lint Python code with Ruff
        run: ruff check app/

      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.created=${{date -u +%Y-%m-%dT%H:%M:%SZ}} \
            -t "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            .

      - name: Start test container
        run: |
          docker run -d --name ${{env.IMAGE_NAME}}-test-container \
          --read-only \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          -p 8080:8080 "$IMAGE_NAME:$IMAGE_TAG"

      - name: Wait for container health check        
        run: |
          for attempt in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' $IMAGE_NAME-test-container)
            if [ "$status" == "healthy" ]; then
              echo "Container is healthy."
              exit 0
            fi
            if [ "$status" == "unhealthy" ]; then
              echo "ERROR:Container health check timed out."
              docker logs $IMAGE_NAME-test-container              
              exit 1
            fi
            sleep 2
          done
          docker logs $IMAGE_NAME-test-container
          echo "Container health check timed out."
          exit 1

      - name: Run HTTP smoke tests
        run: python3 tests/smoke_test.py

      - name: Clean up test container
        if: always()
        run: |
          if docker container inspect $IMAGE_NAME-test-container > /dev/null 2>&1; then            
          docker logs $IMAGE_NAME-test-container 
          docker stop -t 30 $IMAGE_NAME-test-container 
          docker rm $IMAGE_NAME-test-container 
          fi

permissions:  
 packages: write
  release:
    name: Publish Docker image to GHCR
    if: github.event_name == 'workflow_dispatch' && github.event_name !== 'pull_request'
    runs-on: ubuntu-latest
    depends-on: build
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and publish Docker image to GitHub Container Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{date -u +%Y-%m-%dT%H:%M:%SZ}}
          sbom: true
          provenance: true


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      