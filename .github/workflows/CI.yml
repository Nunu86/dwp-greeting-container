name: CI
"on":  
  pull_request:
    branches:
      - main
  
  workflow_dispatch: 

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_TAG: ci-${{ github.sha }} 
  TEST_CONTAINER: ${{ github.event.repository.name }}-test-container

jobs:
  build:
    name: Build and validate Docker image        
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Lint Python code with Ruff
        run: ruff check app/

      - name: Build Docker image
        run: |
          docker build \           
            -t "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            .

      - name: Start test container
        run: |
          docker run -d --name ${{env.TEST_CONTAINER}} \
          --read-only \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          -p 8080:8080 "${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}}"

      - name: Wait for container health check        
        run: |
          for attempt in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' ${{env.TEST_CONTAINER}})
            if [ "$status" == "healthy" ]; then
              echo "Container is healthy."
              exit 0
            fi
            if [ "$status" == "unhealthy" ]; then
              echo "Container is unhealthy."
              docker logs ${{env.TEST_CONTAINER}}              
              exit 1
            fi
            if ["$(docker inspect --format='{{.State.Running}}' ${{env.TEST_CONTAINER}})" !== "true" ]; then
              echo "Container has exited unexpectedly."
              docker logs ${{env.TEST_CONTAINER}}
              exit 1
            fi
            sleep 2
          done
          echo "Container health check timed out."
          docker logs ${{env.TEST_CONTAINER}}         
          exit 1

      - name: Run HTTP smoke tests
        run: python3 tests/smoke_test.py

      - name: Clean up test container
        if: always()
        run: |
          if docker container inspect ${{env.TEST_CONTAINER}} > /dev/null 2>&1; then            
          docker logs ${{env.TEST_CONTAINER}} 
          docker stop -t 30 ${{env.TEST_CONTAINER}} 
          docker rm ${{env.TEST_CONTAINER}} 
          fi


  release:
    name: Publish Docker image to GHCR
    needs: build    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'workflow_dispatch' && github.event_name !== 'pull_request' 
    
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate build timestamp        
        run: echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
        
      - name: Build and publish Docker image to GitHub Container Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{env.BUILD_TIMESTAMP}}
          sbom: true
          provenance: true


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      