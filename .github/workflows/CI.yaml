name: Container CI and Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.0"
        required: true
        type: string


permissions: {}

concurrency:
  group: greeting-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_TAG: ci-${{ github.sha }}
  VERSION: ${{ inputs.version }}
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ${{ github.repository }}

jobs:
  build:
    name: Build, test, scan and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for Secrets with Gitleaks
        shell: bash
        run: |
          docker run --rm \
          --volume "$GITHUB_WORKSPACE:/repo:ro" \
          --workdir /repo \
          ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
          git \
          --redact=100 \
          --exit-code=1 \
          .

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6  #:v2.15.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python linting and validation tools
        run: python -m pip install ruff pytest

      - name: Lint supplied application (without modifying app/)
        run: ruff check app/

      - name: Run unit tests if test script is present
        shell: bash
        run: |
          if find tests -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m pytest -v tests/test_*.py
          else
            echo 'No pytest unit tests found; skipping unit tests.'
          fi

      # QEMU lets an AMD64 GitHub runner execute ARM64 containers for testing.
      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 #v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  #v4.4.1

      - name: Build multi-platform OCI image with BuildKit attestations
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --provenance=mode=max \
            --sbom=true \
            --output type=oci,dest=image.tar \
            .

      # Inspect the locally built OCI archive (image.tar)
      # Verify it contains image manifests for both platforms
      # This confirms both platform images aare included before testing and publishing.
      - name: Install OCI inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Verify OCI archive contains both target platforms
        shell: bash
        run: |
          skopeo inspect --raw oci-archive:image.tar > index.json
          jq -e '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length >= 1
          ' index.json
          jq -e '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length >= 1
          ' index.json


      # Test each architecture from the *same* built OCI archive.
      - name: Load AMD64 image for tests
        run: |
          skopeo copy --override-arch amd64 \
            oci-archive:image.tar "docker-daemon:${IMAGE_NAME}:amd64-test"

      - name: Load ARM64 image for tests
        run: |
          skopeo copy --override-arch arm64 \
            oci-archive:image.tar "docker-daemon:${IMAGE_NAME}:arm64-test"

      - name: Start Container and Test HTTP and health checks on both architectures
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f "${container:-}" 2>/dev/null || true' EXIT
          for arch in amd64 arm64; do
            container="${IMAGE_NAME}-${arch}-test"
            docker run -d --platform "linux/${arch}" \
              --name "$container" \
              --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges \
              -p 127.0.0.1:8080:8080 \
              "${IMAGE_NAME}:${arch}-test"
            healthy=false
            for attempt in {1..30}; do
              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")"
              if [ "$status" = healthy ]; then healthy=true; break; fi
              if [ "$status" = unhealthy ] || [ "$status" = missing ]; then break; fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              docker logs "$container"
              exit 1
            fi
            # Smoke test the running container with Python requests.
            python3 tests/smoke-test.py
            docker stop -t 30 "$container"
            docker rm "$container"
          done

      - name: Scan AMD64 image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:amd64-test
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan ARM64 image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:arm64-test
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true



      # Records the commit SHA and checksum of oci archive file (image.tar).
      - name: Record archive identity
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
          sha256sum image.tar  > artifacts.sha256

      # Attest the provenance and SBOM files for the OCI archive.
      - name: Attest OCI archive provenance
        if: false
        #if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  #v4.2.2
        with:
          subject-path: image.tar


      # GitHub Actions artifact storage, NOT GHCR; no packages:write needed.
      - name: Upload validated image and evidence
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: validated-image
          path: |
            image.tar
            source-commit.txt
            artifacts.sha256
          if-no-files-found: error
          retention-days: 7


  release:
    name: Verify and publish approved OCI image to GHCR
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false


    steps:
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z, e.g. 1.0.0"
            exit 1
          fi

      - name: Download validated OCI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: validated-image
          path: release-artifact

      - name: Verify artifact integrity
        working-directory: release-artifact
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c artifacts.sha256
          if [[ "$(cat source-commit.txt)" != "$GITHUB_SHA" ]]; then
            echo "Artifact source commit does not match workflow commit"
            exit 1
          fi

      - name: Set up Docker Buildx (to apply image description annotation)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  #v4.4.1

      - name: Install OCI inspection tool (skopeo)
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Authenticate Skopeo to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" |
            skopeo login "$REGISTRY" \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Authenticate Docker to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" |
            docker login "$REGISTRY" \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Check release version is unused
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_REPOSITORY,,}:${VERSION}"
          if skopeo inspect --raw "docker://${IMAGE}" \
              > /dev/null 2> registry-error.txt; then
            echo "Release version ${VERSION} already exists"
            exit 1
          fi

          if grep -Eqi 'manifest unknown|manifest_unknown|name unknown|name_unknown' registry-error.txt; then
            echo "Version ${VERSION} is available"
          else
            echo "Unable to confirm version availability"
            cat registry-error.txt
            exit 1
          fi

      - name: Publish validated OCI image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_REPOSITORY,,}:${VERSION}"
          skopeo copy \
            --all \
            --preserve-digests \
            --digestfile published-digest.txt \
            oci-archive:release-artifact/image.tar \
            "docker://${IMAGE}"
          echo "Published ${IMAGE}"

      - name: Verify published digest
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_REPOSITORY,,}:${VERSION}"
          EXPECTED=$(cat published-digest.txt)
          ACTUAL=$(skopeo inspect --raw \
           "docker://${IMAGE}" | sha256sum | cut -d' ' -f1)
            if [[ "$EXPECTED" != "sha256:$ACTUAL" ]]; then
              echo "Published digest verification failed"
              exit 1
            fi
          echo "Published digest verified: ${EXPECTED}"

      - name: Record original manifest digests
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${IMAGE_REPOSITORY,,}:${VERSION}"
          skopeo inspect --raw "docker://${IMAGE}" |
            jq -r '.manifests[].digest' | sort > before.txt


      - name: Add GHCR image index description
        shell: bash
        env:
          IMAGE_DESCRIPTION: ${{ github.event.repository.description || github.event.repository.name }}
        run: |           
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_REPOSITORY,,}:${VERSION}"
          docker buildx imagetools create \
          --annotation "index:org.opencontainers.image.description=${IMAGE_DESCRIPTION}" \
          --tag "${IMAGE}" \
          "${IMAGE}"
          skopeo inspect --raw "docker://${IMAGE}" | \
          jq -e --arg description "${IMAGE_DESCRIPTION}" \
          '.annotations["org.opencontainers.image.description"] == $description'

      - name: Verify manifest integrity
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${IMAGE_REPOSITORY,,}:${VERSION}"
          skopeo inspect --raw "docker://${IMAGE}" |
            jq -r '.manifests[].digest' | sort > after.txt
          diff -u before.txt after.txt
          echo "PASS: All platform and attestation manifests are unchanged"

      - name: Release summary
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${IMAGE_REPOSITORY,,}:${VERSION}"
          {
            echo "## Container Release"
            echo ""
            echo "- Image: \`${IMAGE}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Digest: \`$(cat published-digest.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"







