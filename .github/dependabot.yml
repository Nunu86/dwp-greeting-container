version: 2

updates:
  # Docker base image updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * 7" # every Sunday at 9am
      timezone: "Europe/London"
    open-pull-requests-limit: 1
    groups:
      docker-updates:
        patterns:
          - "*"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 * * 7" # every Sunday at 9am
      timezone: "Europe/London"
    open-pull-requests-limit: 1
    groups:
      github-actions-updates:
        patterns:
          - "*"
